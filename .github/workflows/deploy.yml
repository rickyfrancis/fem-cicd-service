# .github/workflows/deploy.yml — Stable stage, end of segment 10
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/_build.yml

  deploy:
    environment: production
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::324072340488:role/fem-cicd-service
      - run: aws s3 sync dist/ s3://rickyfrancis-fem-cicd-service/ --delete
